<!DOCTYPE html>
<html lang="ka" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ჯანდაცვის გამოწვევა</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #10b981;
      --primary-hover: #059669;
      --border: #1f2937;
      --danger: #ef4444;
      --success: #10b981;
    }
    [data-theme="light"] {
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --text: #111827;
      --text-muted: #6b7280;
      --primary: #059669;
      --primary-hover: #047857;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid var(--border); background: var(--card-bg); }
    .logo { font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; color: var(--primary); }
    nav { display: flex; gap: 1.5rem; }
    nav a { color: var(--text-muted); text-decoration: none; cursor: pointer; font-weight: 500; }
    nav a.active, nav a:hover { color: var(--primary); }
    .btn { background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 0.5rem; cursor: pointer; font-weight: 600; text-decoration: none; transition: background 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    
    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; flex: 1; width: 100%; }
    .view { display: none; }
    .view.active { display: block; }

    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .quiz-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .quiz-badge { font-size: 0.75rem; background: rgba(16, 185, 129, 0.1); color: var(--primary); padding: 0.25rem 0.75rem; border-radius: 1rem; width: fit-content; font-weight: 600; }
    .quiz-card h3 { font-size: 1.1rem; line-height: 1.4; }
    .quiz-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; }

    .player-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .player-top { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.9rem; }
    .progress-bar { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
    .player-prompt { font-size: 1.25rem; line-height: 1.5; }
    .options-grid { display: flex; flex-direction: column; gap: 0.75rem; }
    .option-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 1rem; border-radius: 0.5rem; text-align: left; cursor: pointer; font-size: 1rem; transition: all 0.2s; display: flex; gap: 1rem; align-items: center; }
    .option-btn:hover:not(:disabled) { border-color: var(--primary); background: rgba(16, 185, 129, 0.05); }
    .option-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: var(--success); }
    .option-btn.incorrect { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: var(--danger); }
    .explanation-box { background: var(--bg); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem; margin-top: 1rem; font-size: 0.95rem; line-height: 1.5; }
    
    .result-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1rem; padding: 3rem 2rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
    .result-score { font-size: 4rem; font-weight: bold; color: var(--primary); }
  </style>
</head>
<body>

  <header>
    <div class="logo">🌿 ჯანდაცვის გამოწვევა</div>
    <nav>
      <a data-route="play" class="active" onclick="navigate('play')">თამაში</a>
    </nav>
    <div>
      <button class="btn btn-secondary" id="theme-toggle">🌓</button>
    </div>
  </header>

  <div class="container">
    <!-- Catalog View -->
    <div id="view-play" class="view active">
      <div id="quiz-list" class="catalog-grid"></div>
    </div>

    <!-- Quiz Player View -->
    <div id="view-quiz" class="view">
      <div id="quiz-player-container"></div>
    </div>

    <!-- Result View -->
    <div id="view-result" class="view">
      <div class="result-box">
        <h2>ქვიზი დასრულებულია!</h2>
        <div class="result-score" id="res-score">0</div>
        <p id="res-total" style="color: var(--text-muted);">შესაძლო ქულიდან</p>
        <button class="btn" onclick="navigate('play')">მთავარ გვერდზე დაბრუნება</button>
      </div>
    </div>
  </div>

  <script>
    // სადემონსტრაციო და სრული ლოკალური მონაცემები
    const localQuizzes = [
      { id: 'pack-1', title: 'ეპიდემიოლოგია — პაკეტი #1', theme: 'ეპიდემიოლოგია', question_count: 3 },
      { id: 'pack-2', title: 'ჯანდაცვის მენეჯმენტი — პაკეტი #1', theme: 'ჯანდაცვის მენეჯმენტი', question_count: 3 }
    ];

    const localQuestions = {
      'pack-1': [
        {
          id: 'q1',
          prompt: 'რომელი მიდგომა არის მტკიცებულებებზე დაფუძნებული საზოგადოებრივ ჯანდაცვაში?',
          options: [
            'ინდივიდუალური კლინიკური მკურნალობის იზოლირებული მიდგომა',
            'მოსახლეობის ჯანმრთელობაზე ორიენტირებული პრევენციული ღონისძიება',
            'მხოლოდ ადმინისტრაციული დანახარჯების ზრდა',
            'სამედიცინო სტატისტიკის ფარული ანალიზი'
          ],
          answer_index: 1,
          explanation: 'საზოგადოებრივი ჯანდაცვა ფოკუსირებულია მთლიანი პოპულაციის ჯანმრთელობის დაცვასა და პრევენციაზე.',
          source_url: 'https://www.who.int',
          source_title: 'WHO — Health Promotion'
        },
        {
          id: 'q2',
          prompt: 'რას გულისხმობს ეპიდემიოლოგიური ზედამხედველობა?',
          options: [
            'მხოლოდ საავადმყოფოების დაფინანსების კონტროლს',
            'დაავადებათა გავრცელების სისტემატურ შეგროვებას, ანალიზსა და ინტერპრეტაციას',
            'ექიმების ატესტაციის ჩატარებას',
            'ფარმაცევტული კომპანიების რეკლამირებას'
          ],
          answer_index: 1,
          explanation: 'ეპიდემიოლოგიური ზედამხედველობა არის ჯანმრთელობასთან დაკავშირებული მონაცემების მუდმივი შეგროვება.',
          source_url: 'https://www.cdc.gov',
          source_title: 'CDC Principles'
        },
        {
          id: 'q3',
          prompt: 'რა არის მთავარი მიზანი პირველადი ჯანდაცვის რგოლისა?',
          options: [
            'მაღალტექნოლოგიური ქირურგიული ოპერაციები',
            'მოსახლეობისთვის ხელმისაწვდომი, ძირითადი სამედიცინო და პრევენციული მომსახურების მიწოდება',
            'მხოლოდ სამეცნიერო კვლევების წარმოება',
            'სამედიცინო აპარატურის იმპორტი'
          ],
          answer_index: 1,
          explanation: 'პირველადი ჯანდაცვა არის ჯანდაცვის სისტემის საფუძველი, რომელიც უზრუნველყოფს პრევენციას და ძირითად ზრუნვას.',
          source_url: 'https://www.who.int',
          source_title: 'WHO Primary Health Care'
        }
      ],
      'pack-2': [
        {
          id: 'q4',
          prompt: 'რა იგულისხმება ჯანდაცვის ხარისხის მართვაში?',
          options: [
            'მხოლოდ პაციენტების რაოდენობის ზრდა',
            'უსაფრთხო, ეფექტიანი და პაციენტზე ორიენტირებული მომსახურების უზრუნველყოფა',
            'კლინიკის შენობის რემონტი',
            'მედიკამენტების ფასების გაძვირება'
          ],
          answer_index: 1,
          explanation: 'ხარისხიანი ჯანდაცვა ნიშნავს უსაფრთხო, დროულ და ეფექტურ სერვისებს.',
          source_url: 'https://www.who.int',
          source_title: 'WHO Quality Services'
        },
        {
          id: 'q5',
          prompt: 'რომელი ფაქტორი ახდენს ყველაზე დიდ გავლენას საზოგადოების ჯანმრთელობაზე?',
          options: [
            'მხოლოდ ძვირადღირებული კლინიკები',
            'სოციალურ-ეკონომიკური და გარემო პირობები (სოციალური დეტერმინანტები)',
            'მედიკამენტების ფართო რეკლამა',
            'სამედიცინო უნივერსიტეტების რეიტინგი'
          ],
          answer_index: 1,
          explanation: 'ჯანმრთელობის სოციალური დეტერმინანტები განაპირობებენ მოსახლეობის ჯანმრთელობის ძირითად ნაწილს.',
          source_url: 'https://www.who.int',
          source_title: 'Social Determinants of Health'
        },
        {
          id: 'q6',
          prompt: 'რა არის ჯანდაცვის პოლიტიკის ძირითადი ამოცანა?',
          options: [
            'მოსახლეობის ჯანმრთელობის გაუმჯობესება და რესურსების სამართლიანი განაწილება',
            'მხოლოდ კერძო საავადმყოფოების სუბსიდირება',
            'ექიმების ხელფასების შემცირება',
            'სამედიცინო ბიუროკრატიის გაზრდა'
          ],
          answer_index: 1,
          explanation: 'ჯანდაცვის პოლიტიკა მიმართულია თანასწორობის, ხელმისაწვდომობის და ჯანმრთელობის დაცვისკენ.',
          source_url: 'https://www.who.int',
          source_title: 'Health Policy'
        }
      ]
    };

    let currentQuiz = null;
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    function $(id) { return document.getElementById(id); }

    function navigate(route) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      if (route === 'play') {
        $('view-play').classList.add('active');
        renderCatalog();
      } else if (route === 'result') {
        $('view-result').classList.add('active');
      }
    }

    function renderCatalog() {
      const list = $('quiz-list');
      list.innerHTML = localQuizzes.map(q => `
        <div class="quiz-card">
          <span class="quiz-badge">${q.theme}</span>
          <h3>${q.title}</h3>
          <div class="quiz-meta">
            <span>${q.question_count} კითხვა</span>
            <span>2 წუთი</span>
          </div>
          <button class="btn" onclick="startQuiz('${q.id}')">დაწყება →</button>
        </div>
      `).join('');
    }

    function startQuiz(quizId) {
      currentQuiz = localQuizzes.find(q => q.id === quizId);
      currentQuestions = localQuestions[quizId] || [];
      currentIndex = 0;
      score = 0;

      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      $('view-quiz').classList.add('active');
      renderQuestion();
    }

    function renderQuestion() {
      const container = $('quiz-player-container');
      const q = currentQuestions[currentIndex];
      const total = currentQuestions.length;
      const progress = Math.round((currentIndex / total) * 100);

      container.innerHTML = `
        <div class="player-box">
          <div class="player-top">
            <span>${currentQuiz.theme}</span>
            <span>კითხვა ${currentIndex + 1} / ${total}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${progress}%"></div>
          </div>
          <h2 class="player-prompt">${q.prompt}</h2>
          <div class="options-grid">
            ${q.options.map((opt, idx) => `
              <button class="option-btn" onclick="handleAnswer(${idx})">
                <span style="font-weight:bold; color:var(--primary);">${['A','B','C','D'][idx]}</span>
                <span>${opt}</span>
              </button>
            `).join('')}
          </div>
          <div id="exp-box" class="explanation-box" style="display:none;"></div>
          <div style="margin-top: 1rem; text-align: right;">
            <button id="next-btn" class="btn" style="display:none;" onclick="nextQuestion()">შემდეგი →</button>
          </div>
        </div>
      `;
    }

    window.handleAnswer = function(chosenIdx) {
      const q = currentQuestions[currentIndex];
      const isCorrect = Number(chosenIdx) === Number(q.answer_index);
      if (isCorrect) score += 100;

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === Number(q.answer_index)) btn.classList.add('correct');
        if (idx === Number(chosenIdx) && !isCorrect) btn.classList.add('incorrect');
      });

      const expBox = $('exp-box');
      expBox.innerHTML = `
        <div style="font-weight:bold; margin-bottom:0.5rem;">${isCorrect ? '✓ სწორია!' : '✕ არასწორია'}</div>
        <p>${q.explanation}</p>
        <a href="${q.source_url}" target="_blank" style="color:var(--primary); display:inline-block; margin-top:0.5rem;">წყარო: ${q.source_title}</a>
      `;
      expBox.style.display = 'block';

      const nextBtn = $('next-btn');
      nextBtn.style.display = 'inline-block';
      nextBtn.textContent = (currentIndex + 1 < currentQuestions.length) ? 'შემდეგი კითხვა →' : 'შედეგების ნახვა →';
    };

    window.nextQuestion = function() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        renderQuestion();
      } else {
        $('res-score').textContent = score;
        $('res-total').textContent = `${currentQuestions.length * 100} შესაძლო ქულიდან`;
        navigate('result');
      }
    };

    // თემის გადართვა
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    });

    // საწყისი ჩატვირთვა
    renderCatalog();
  </script>
</body>
</html>
