<!DOCTYPE html>
<html lang="ka" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ჯანდაცვის გამოწვევა</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #10b981;
      --primary-hover: #059669;
      --border: #1f2937;
      --danger: #ef4444;
      --success: #10b981;
    }
    [data-theme="light"] {
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --text: #111827;
      --text-muted: #6b7280;
      --primary: #059669;
      --primary-hover: #047857;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid var(--border); background: var(--card-bg); }
    .logo { font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; color: var(--primary); cursor: pointer; }
    nav { display: flex; gap: 1.5rem; }
    nav a { color: var(--text-muted); text-decoration: none; cursor: pointer; font-weight: 500; }
    nav a.active, nav a:hover { color: var(--primary); }
    .actions { display: flex; gap: 1rem; align-items: center; }
    .btn { background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 0.5rem; cursor: pointer; font-weight: 600; text-decoration: none; transition: background 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { background: var(--border); }
    
    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; flex: 1; width: 100%; }
    .view { display: none; }
    .view.active { display: block; }

    /* Catalog */
    .catalog-filters { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .catalog-filters input, .catalog-filters select { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.6rem 1rem; border-radius: 0.5rem; font-size: 0.95rem; outline: none; flex: 1; min-width: 200px; }
    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .quiz-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .quiz-badge { font-size: 0.75rem; background: rgba(16, 185, 129, 0.1); color: var(--primary); padding: 0.25rem 0.75rem; border-radius: 1rem; width: fit-content; font-weight: 600; }
    .quiz-card h3 { font-size: 1.1rem; line-height: 1.4; }
    .quiz-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; }

    /* Player */
    .player-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .player-top { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.9rem; }
    .progress-bar { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
    .player-prompt { font-size: 1.25rem; line-height: 1.5; }
    .options-grid { display: flex; flex-direction: column; gap: 0.75rem; }
    .option-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 1rem; border-radius: 0.5rem; text-align: left; cursor: pointer; font-size: 1rem; transition: all 0.2s; display: flex; gap: 1rem; align-items: center; }
    .option-btn:hover:not(:disabled) { border-color: var(--primary); background: rgba(16, 185, 129, 0.05); }
    .option-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: var(--success); }
    .option-btn.incorrect { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: var(--danger); }
    .explanation-box { background: var(--bg); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem; margin-top: 1rem; font-size: 0.95rem; line-height: 1.5; }
    
    /* Auth & Leaderboard */
    .auth-box, .result-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1rem; padding: 2.5rem; max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.2rem; }
    .auth-box input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.8rem; border-radius: 0.5rem; outline: none; }
    .table-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1rem; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 1rem; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    th { background: rgba(255,255,255,0.02); color: var(--text-muted); font-weight: 600; }
    .loading, .empty { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 1.1rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="navigate('play')">🌿 ჯანდაცვის გამოწვევა</div>
    <nav>
      <a data-route="play" class="active" onclick="navigate('play')">თამაში</a>
      <a data-route="leaderboard" onclick="navigate('leaderboard')">რეიტინგი</a>
    </nav>
    <div class="actions">
      <button class="btn btn-secondary" id="theme-toggle">🌓</button>
      <div id="auth-action-area">
        <button class="btn" onclick="navigate('auth')">შესვლა / რეგისტრაცია</button>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Catalog View -->
    <div id="view-play" class="view active">
      <div class="catalog-filters">
        <input type="text" id="search-input" placeholder="მოძებნე ქუიზი ან თემა..." oninput="filterQuizzes()">
        <select id="theme-select" onchange="filterQuizzes()">
          <option value="">ყველა თემა</option>
          <option value="ეპიდემიოლოგია">ეპიდემიოლოგია</option>
          <option value="ჯანდაცვის მენეჯმენტი">ჯანდაცვის მენეჯმენტი</option>
          <option value="პრევენცია და ჯანმრთელობის განათლება">პრევენცია და ჯანმრთელობის განათლება</option>
          <option value="გარემო და ინფექციების კონტროლი">გარემო და ინფექციების კონტროლი</option>
          <option value="მტკიცებულებები და ჯანდაცვის პოლიტიკა">მტკიცებულებები და ჯანდაცვის პოლიტიკა</option>
        </select>
      </div>
      <div id="quiz-list" class="catalog-grid"></div>
    </div>

    <!-- Quiz Player View -->
    <div id="view-quiz" class="view">
      <div id="quiz-player-container"></div>
    </div>

    <!-- Result View -->
    <div id="view-result" class="view">
      <div class="result-box" style="text-align: center;">
        <h2>ქვიზი დასრულებულია!</h2>
        <div style="font-size: 4rem; font-weight: bold; color: var(--primary);" id="res-score">0</div>
        <p id="res-total" style="color: var(--text-muted);"></p>
        <button class="btn" onclick="navigate('play')">მთავარ გვერდზე დაბრუნება</button>
      </div>
    </div>

    <!-- Leaderboard View -->
    <div id="view-leaderboard" class="view">
      <h2 style="margin-bottom: 1.5rem;">🏆 საუკეთესო შედეგები</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>მონაწილე</th>
              <th>ქუიზი</th>
              <th>ქულა</th>
              <th>დრო</th>
            </tr>
          </thead>
          <tbody id="leaderboard-tbody">
            <tr><td colspan="5" class="loading">იტვირთება...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Auth View -->
    <div id="view-auth" class="view">
      <div class="auth-box">
        <h2>ავტორიზაცია</h2>
        <input type="email" id="auth-email" placeholder="ელ-ფოსტა">
        <input type="password" id="auth-password" placeholder="პაროლი">
        <button class="btn" onclick="handleLogin()">შესვლა</button>
        <button class="btn btn-secondary" onclick="handleSignUp()">რეგისტრაცია</button>
        <div id="auth-msg" style="font-size: 0.85rem; color: var(--primary);"></div>
      </div>
    </div>
  </div>

  <script>
    // Supabase კონფიგურაცია (ჩასვი შენი რეალური გასაღებები)
    const SUPABASE_URL = "https://შენი-პროექტი.supabase.co";
    const SUPABASE_KEY = "შენი_anon_key";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allQuizzes = [];
    let currentQuiz = null;
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let quizStartTime = 0;
    let currentUser = null;

    function $(id) { return document.getElementById(id); }

    window.addEventListener('DOMContentLoaded', async () => {
      setupTheme();
      checkUser();
      await loadCatalog();
      navigate(window.location.hash.replace('#', '') || 'play');
    });

    window.addEventListener('hashchange', () => {
      navigate(window.location.hash.replace('#', '') || 'play');
    });

    function navigate(route) {
      window.location.hash = route;
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.getAttribute('data-route') === route));
      
      const target = $(`view-${route}`);
      if (target) target.classList.add('active');

      if (route === 'leaderboard') loadLeaderboard();
    }

    function setupTheme() {
      const saved = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      $('theme-toggle').addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    }

    async function checkUser() {
      const { data } = await supabase.auth.getUser();
      currentUser = data.user;
      updateAuthUI();
    }

    function updateAuthUI() {
      const area = $('auth-action-area');
      if (currentUser) {
        area.innerHTML = `<span style="font-size:0.9rem; color:var(--text-muted);">${currentUser.email}</span> <button class="btn btn-secondary" onclick="handleLogout()">გასვლა</button>`;
      } else {
        area.innerHTML = `<button class="btn" onclick="navigate('auth')">შესვლა / რეგისტრაცია</button>`;
      }
    }

    async function handleLogin() {
      const email = $('auth-email').value;
      const password = $('auth-password').value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) { $('auth-msg').textContent = error.message; }
      else { await checkUser(); navigate('play'); }
    }

    async function handleSignUp() {
      const email = $('auth-email').value;
      const password = $('auth-password').value;
      const { error } = await supabase.auth.signUp({ email, password });
      if (error) { $('auth-msg').textContent = error.message; }
      else { $('auth-msg').textContent = 'რეგისტრაცია წარმატებულია! შეამოწმეთ მეილი.'; }
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      currentUser = null;
      updateAuthUI();
      navigate('play');
    }

    async function loadCatalog() {
      const list = $('quiz-list');
      list.innerHTML = '<div class="loading">იტვირთება ქუიზები...</div>';

      const { data, error } = await supabase.from('quizzes').select('*').order('id');
      if (error || !data) {
        list.innerHTML = '<div class="empty">ქუიზები ვერ ჩაიტვირთა.</div>';
        return;
      }
      allQuizzes = data;
      renderQuizzes(allQuizzes);
    }

    function renderQuizzes(quizzes) {
      const list = $('quiz-list');
      if (!quizzes.length) {
        list.innerHTML = '<div class="empty">ქუიზები ვერ მოიძებნა.</div>';
        return;
      }
      list.innerHTML = quizzes.map(q => `
        <div class="quiz-card">
          <span class="quiz-badge">${q.theme || 'ზოგადი'}</span>
          <h3>${q.title}</h3>
          <div class="quiz-meta">
            <span>${q.question_count || 15} კითხვა</span>
            <span>10 წუთი</span>
          </div>
          <button class="btn" onclick="startQuiz('${q.id}')">დაწყება →</button>
        </div>
      `).join('');
    }

    function filterQuizzes() {
      const search = $('search-input').value.toLowerCase();
      const theme = $('theme-select').value;
      const filtered = allQuizzes.filter(q => {
        const matchText = (q.title || '').toLowerCase().includes(search) || (q.theme || '').toLowerCase().includes(search);
        const matchTheme = !theme || q.theme === theme;
        return matchText && matchTheme;
      });
      renderQuizzes(filtered);
    }

    async function startQuiz(quizId) {
      const container = $('quiz-player-container');
      container.innerHTML = '<div class="loading">კითხვები იტვირთება...</div>';
      navigate('quiz/' + quizId);

      const { data: quiz } = await supabase.from('quizzes').select('*').eq('id', quizId).single();
      if (!quiz) return;
      currentQuiz = quiz;

      const { data: questions } = await supabase.from('questions').select('*').in('id', quiz.question_ids);
      if (!questions) return;

      const map = new Map(questions.map(item => [item.id, item]));
      currentQuestions = quiz.question_ids.map(id => map.get(id)).filter(Boolean);

      currentIndex = 0;
      score = 0;
      quizStartTime = Date.now();
      renderQuestion();
    }

    function renderQuestion() {
      const container = $('quiz-player-container');
      const q = currentQuestions[currentIndex];
      const total = currentQuestions.length;
      const progress = Math.round((currentIndex / total) * 100);

      container.innerHTML = `
        <div class="player-box">
          <div class="player-top">
            <span>${currentQuiz.theme}</span>
            <span>კითხვა ${currentIndex + 1} / ${total}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${progress}%"></div>
          </div>
          <h2 class="player-prompt">${q.prompt}</h2>
          <div class="options-grid">
            ${q.options.map((opt, idx) => `
              <button class="option-btn" onclick="handleAnswer(${idx})">
                <span style="font-weight:bold; color:var(--primary);">${['A','B','C','D'][idx]}</span>
                <span>${opt}</span>
              </button>
            `).join('')}
          </div>
          <div id="exp-box" class="explanation-box" style="display:none;"></div>
          <div style="margin-top: 1rem; text-align: right;">
            <button id="next-btn" class="btn" style="display:none;" onclick="nextQuestion()">შემდეგი →</button>
          </div>
        </div>
      `;
    }

    window.handleAnswer = function(chosenIdx) {
      const q = currentQuestions[currentIndex];
      const isCorrect = Number(chosenIdx) === Number(q.answer_index);
      if (isCorrect) score += 100;

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === Number(q.answer_index)) btn.classList.add('correct');
        if (idx === Number(chosenIdx) && !isCorrect) btn.classList.add('incorrect');
      });

      const expBox = $('exp-box');
      expBox.innerHTML = `
        <div style="font-weight:bold; margin-bottom:0.5rem;">${isCorrect ? '✓ სწორია!' : '✕ არასწორია'}</div>
        <p>${q.explanation || ''}</p>
        ${q.source_url ? `<a href="${q.source_url}" target="_blank" style="color:var(--primary); display:inline-block; margin-top:0.5rem;">წყარო: ${q.source_title || 'გადასვლა'}</a>` : ''}
      `;
      expBox.style.display = 'block';

      const nextBtn = $('next-btn');
      nextBtn.style.display = 'inline-block';
      nextBtn.textContent = (currentIndex + 1 < currentQuestions.length) ? 'შემდეგი კითხვა →' : 'შედეგების ნახვა →';
    };

    window.nextQuestion = async function() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        renderQuestion();
      } else {
        const timeSec = Math.round((Date.now() - quizStartTime) / 1000);
        $('res-score').textContent = score;
        $('res-total').textContent = `${currentQuestions.length * 100} შესაძლო ქულიდან`;
        
        // შევინახოთ შედეგი ბაზაში თუ ავტორიზებულია
        if (currentUser && currentQuiz) {
          await supabase.from('scores').insert({
            quiz_id: currentQuiz.id,
            player_name: currentUser.email.split('@')[0],
            score: score,
            time_seconds: timeSec
          });
        }
        navigate('result');
      }
    };

    async function loadLeaderboard() {
      const tbody = $('leaderboard-tbody');
      tbody.innerHTML = '<tr><td colspan="5" class="loading">იტვირთება რეიტინგი...</td></tr>';

      const { data, error } = await supabase
        .from('scores')
        .select('player_name, score, time_seconds, quizzes(title)')
        .order('score', { ascending: false })
        .limit(20);

      if (error || !data || !data.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">რეიტინგები ჯერ ცარიელია.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map((row, idx) => `
        <tr>
          <td>${idx + 1}</td>
          <td><strong>${row.player_name || 'ანონიმი'}</strong></td>
          <td>${row.quizzes?.title || 'ქუიზი'}</td>
          <td><span style="color:var(--primary); font-weight:bold;">${row.score}</span></td>
          <td>${row.time_seconds ? row.time_seconds + ' წმ' : '-'}</td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
