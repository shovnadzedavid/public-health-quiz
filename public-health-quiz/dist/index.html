<!DOCTYPE html>
<html lang="ka" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ჯანდაცვის გამოწვევა</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(19, 27, 46, 0.75);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #10b981;
      --primary-hover: #059669;
      --border: rgba(255, 255, 255, 0.08);
      --danger: #ef4444;
      --success: #10b981;
    }
    [data-theme="light"] {
      --bg: #f3f4f6;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text: #111827;
      --text-muted: #6b7280;
      --primary: #059669;
      --primary-hover: #047857;
      --border: rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease;
    }

    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 1rem 2rem; 
      border-bottom: 1px solid var(--border); 
      background: var(--card-bg); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; color: var(--primary); cursor: pointer; }
    nav { display: flex; gap: 1.5rem; }
    nav a { color: var(--text-muted); text-decoration: none; cursor: pointer; font-weight: 500; transition: color 0.2s; }
    nav a.active, nav a:hover { color: var(--primary); }
    
    .actions { display: flex; gap: 1rem; align-items: center; }
    .btn { background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 0.5rem; cursor: pointer; font-weight: 600; text-decoration: none; transition: all 0.2s; }
    .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); }

    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; flex: 1; width: 100%; }
    
    .view { display: none; opacity: 0; transform: translateY(8px); transition: opacity 0.3s ease, transform 0.3s ease; }
    .view.active { display: block; opacity: 1; transform: translateY(0); }

    /* Catalog Grid & Cards */
    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .quiz-card { 
      background: var(--card-bg); 
      backdrop-filter: blur(12px);
      border: 1px solid var(--border); 
      border-radius: 1rem; 
      padding: 1.5rem; 
      display: flex; 
      flex-direction: column; 
      gap: 1rem; 
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); 
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .quiz-card:hover {
      transform: translateY(-4px);
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.2);
    }
    .quiz-badge { font-size: 0.75rem; background: rgba(16, 185, 129, 0.1); color: var(--primary); padding: 0.25rem 0.75rem; border-radius: 1rem; width: fit-content; font-weight: 600; }
    .quiz-card h3 { font-size: 1.1rem; line-height: 1.4; }
    .quiz-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; }

    /* Player Box */
    .player-box { 
      background: var(--card-bg); 
      backdrop-filter: blur(12px);
      border: 1px solid var(--border); 
      border-radius: 1rem; 
      padding: 2rem; 
      display: flex; 
      flex-direction: column; 
      gap: 1.5rem; 
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
    }
    .player-top { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.9rem; }
    .progress-bar { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
    .player-prompt { font-size: 1.25rem; line-height: 1.5; }
    
    .options-grid { display: flex; flex-direction: column; gap: 0.75rem; }
    .option-btn { 
      background: rgba(255,255,255,0.02); 
      border: 1px solid var(--border); 
      color: var(--text); 
      padding: 1rem; 
      border-radius: 0.75rem; 
      text-align: left; 
      cursor: pointer; 
      font-size: 1rem; 
      transition: all 0.2s ease; 
      display: flex; 
      gap: 1rem; 
      align-items: center; 
    }
    .option-btn:hover:not(:disabled) { border-color: var(--primary); background: rgba(16, 185, 129, 0.05); transform: translateX(4px); }
    .option-btn.correct { background: rgba(16, 185, 129, 0.15); border-color: var(--success); color: var(--success); }
    .option-btn.incorrect { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); color: var(--danger); }
    
    .explanation-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1rem; margin-top: 1rem; font-size: 0.95rem; line-height: 1.5; }
    
    /* Result & Auth Boxes */
    .result-box, .auth-box { 
      background: var(--card-bg); 
      backdrop-filter: blur(12px);
      border: 1px solid var(--border); 
      border-radius: 1rem; 
      padding: 3rem 2rem; 
      text-align: center; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 1.5rem; 
      max-width: 450px; 
      margin: 0 auto; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
    .result-score { font-size: 4rem; font-weight: 800; color: var(--primary); }
    
    .auth-box input { 
      width: 100%; 
      background: rgba(255,255,255,0.03); 
      border: 1px solid var(--border); 
      color: var(--text); 
      padding: 0.9rem 1rem; 
      border-radius: 0.75rem; 
      outline: none; 
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .auth-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }
    
    /* Leaderboard & Admin Tables */
    .table-container { 
      background: var(--card-bg); 
      backdrop-filter: blur(12px);
      border: 1px solid var(--border); 
      border-radius: 1rem; 
      overflow: hidden; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 1.1rem 1.5rem; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    th { background: rgba(255,255,255,0.03); color: var(--text-muted); font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="navigate('play')">🌿 ჯანდაცვის გამოწვევა</div>
    <nav>
      <a data-route="play" onclick="navigate('play')">თამაში</a>
      <a data-route="leaderboard" onclick="navigate('leaderboard')">რეიტინგი</a>
      <a data-route="admin" onclick="navigate('admin')">მართვა</a>
    </nav>
    <div class="actions">
      <button class="btn btn-secondary" id="theme-toggle" title="თემის გადართვა">🌓</button>
      <button class="btn btn-secondary" onclick="navigate('auth')">შესვლა</button>
      <button class="btn" onclick="navigate('auth')">რეგისტრაცია</button>
    </div>
  </header>

  <div class="container">
    <!-- Catalog View -->
    <div id="view-play" class="view active">
      <div id="quiz-list" class="catalog-grid"></div>
    </div>

    <!-- Quiz Player View -->
    <div id="view-quiz" class="view">
      <div id="quiz-player-container"></div>
    </div>

    <!-- Result View -->
    <div id="view-result" class="view">
      <div class="result-box">
        <h2>ქვიზი დასრულებულია!</h2>
        <div class="result-score" id="res-score">0</div>
        <p id="res-total" style="color: var(--text-muted);">შესაძლო ქულიდან</p>
        <button class="btn" style="width:100%;" onclick="navigate('play')">მთავარ გვერდზე დაბრუნება</button>
      </div>
    </div>

    <!-- Leaderboard View -->
    <div id="view-leaderboard" class="view">
      <h2 style="margin-bottom: 1.5rem; font-weight: 700;">🏆 საუკეთესო შედეგები</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>მონაწილე</th>
              <th>ქუიზი</th>
              <th>ქულა</th>
            </tr>
          </thead>
          <tbody id="leaderboard-tbody">
            <tr><td colspan="4" style="text-align:center; padding:2rem; color:var(--text-muted);">ჩანაწერები ჯერ არ არის.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Admin View -->
    <div id="view-admin" class="view">
      <h2 style="margin-bottom: 1.5rem; font-weight: 700;">⚙️ მართვის პანელი</h2>
      <div class="table-container" style="padding: 2rem;">
        <p style="color: var(--text-muted); margin-bottom: 1rem;">აქედან შესაძლებელია კითხვებისა და პაკეტების მართვა.</p>
        <button class="btn" onclick="alert('სისტემა მუშაობს ლოკალურ რეჟიმში (375 კითხვა აქტიურია)')">ბაზის სტატუსის შემოწმება</button>
      </div>
    </div>

    <!-- Auth View -->
    <div id="view-auth" class="view">
      <div class="auth-box">
        <div style="text-align: center;">
          <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.3rem;">ავტორიზაცია</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem;">შედით სისტემაში ქულების შესანახად</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 1rem; width: 100%;">
          <input type="email" id="auth-email" placeholder="ელ-ფოსტა">
          <input type="password" id="auth-password" placeholder="პაროლი">
          <button class="btn" style="width:100%; padding: 0.8rem;" onclick="handleAuth()">შესვლა</button>
        </div>
        <div id="auth-msg" style="font-size: 0.85rem; text-align: center; color: var(--primary);"></div>
      </div>
    </div>
  </div>

  <script>
    const themesConfig = [
      { theme: "ეპიდემიოლოგია", icon: "🦠", prefix: "v04-epidemiology", count: 5, src_url: "https://archive.cdc.gov/www_cdc_gov/csels/dsepd/ss1978/lesson1/section1.html", src_title: "CDC — ეპიდემიოლოგიის პრინციპები" },
      { theme: "ჯანდაცვის მენეჯმენტი", icon: "📊", prefix: "v04-management", count: 5, src_url: "https://www.who.int/en/news-room/fact-sheets/detail/quality-health-services", src_title: "WHO — Quality health services" },
      { theme: "პრევენცია და ჯანმრთელობის განათლება", icon: "🩺", prefix: "v04-prevention", count: 5, src_url: "https://www.who.int/health-topics/health-promotion", src_title: "WHO — Health promotion" },
      { theme: "გარემო და ინფექციების კონტროლი", icon: "🍃", prefix: "v04-environment", count: 5, src_url: "https://www.who.int/news-room/fact-sheets/detail/ambient-(outdoor)-air-quality-and-health", src_title: "WHO: Ambient air pollution" },
      { theme: "მტკიცებულებები და ჯანდაცვის პოლიტიკა", icon: "📑", prefix: "v04-evidence", count: 5, src_url: "https://www.who.int/health-topics/health-policy", src_title: "WHO — Health Policy" }
    ];

    const allQuizzes = [];
    const allQuestions = {};

    themesConfig.forEach(t => {
      for (let p = 1; p <= t.count; p++) {
        const packId = `${t.prefix}-pack-${p < 10 ? '0' + p : p}`;
        allQuizzes.push({
          id: packId,
          title: `${t.theme} — პაკეტი #${p}`,
          theme: t.theme,
          icon: t.icon,
          question_count: 15
        });

        const packQuestions = [];
        for (let q = 1; q <= 15; q++) {
          packQuestions.push({
            id: `${packId}-q${q}`,
            prompt: `[${t.theme} - პაკეტი #${p}] საზოგადოებრივი ჯანდაცვის კითხვა ნომერი ${q}: რომელი მიდგომა არის მტკიცებულებებზე დაფუძნებული?`,
            options: [
              "ინდივიდუალური კლინიკური მკურნალობის იზოლირებული მიდგომა",
              "მოსახლეობის ჯანმრთელობაზე ორიენტირებული პრევენციული ღონისძიება",
              "მხოლოდ ადმინისტრაციული დანახარჯების მექანიკური ზრდა",
              "სამედიცინო სტატისტიკის ფარული ანალიზი"
            ],
            answer_index: 1,
            explanation: `ეს არის სოციალური და საზოგადოებრივი ჯანდაცვის სტანდარტული პრინციპი თემაზე: ${t.theme}.`,
            source_url: t.src_url,
            source_title: t.src_title
          });
        }
        allQuestions[packId] = packQuestions;
      }
    });

    let currentQuiz = null;
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    function $(id) { return document.getElementById(id); }

    function navigate(route) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.getAttribute('data-route') === route));

      if (route === 'play') {
        $('view-play').classList.add('active');
        renderCatalog();
      } else if (route === 'leaderboard') {
        $('view-leaderboard').classList.add('active');
      } else if (route === 'admin') {
        $('view-admin').classList.add('active');
      } else if (route === 'auth') {
        $('view-auth').classList.add('active');
      } else if (route === 'result') {
        $('view-result').classList.add('active');
      }
    }

    function renderCatalog() {
      const list = $('quiz-list');
      list.innerHTML = allQuizzes.map(q => `
        <div class="quiz-card">
          <span class="quiz-badge">${q.icon} ${q.theme}</span>
          <h3>${q.title}</h3>
          <div class="quiz-meta">
            <span>${q.question_count} კითხვა</span>
            <span>10 წუთი</span>
          </div>
          <button class="btn" onclick="startQuiz('${q.id}')">დაწყება →</button>
        </div>
      `).join('');
    }

    function startQuiz(quizId) {
      currentQuiz = allQuizzes.find(q => q.id === quizId);
      currentQuestions = allQuestions[quizId] || [];
      currentIndex = 0;
      score = 0;

      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      $('view-quiz').classList.add('active');
      renderQuestion();
    }

    function renderQuestion() {
      const container = $('quiz-player-container');
      const q = currentQuestions[currentIndex];
      const total = currentQuestions.length;
      const progress = Math.round((currentIndex / total) * 100);

      container.innerHTML = `
        <div class="player-box">
          <div class="player-top">
            <span>${currentQuiz.icon} ${currentQuiz.theme}</span>
            <span>კითხვა ${currentIndex + 1} / ${total}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${progress}%"></div>
          </div>
          <h2 class="player-prompt">${q.prompt}</h2>
          <div class="options-grid">
            ${q.options.map((opt, idx) => `
              <button class="option-btn" onclick="handleAnswer(${idx})">
                <span style="font-weight:bold; color:var(--primary);">${['A','B','C','D'][idx]}</span>
                <span>${opt}</span>
              </button>
            `).join('')}
          </div>
          <div id="exp-box" class="explanation-box" style="display:none;"></div>
          <div style="margin-top: 1rem; text-align: right;">
            <button id="next-btn" class="btn" style="display:none;" onclick="nextQuestion()">შემდეგი →</button>
          </div>
        </div>
      `;
    }

    window.handleAnswer = function(chosenIdx) {
      const q = currentQuestions[currentIndex];
      const isCorrect = Number(chosenIdx) === Number(q.answer_index);
      if (isCorrect) score += 100;

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === Number(q.answer_index)) btn.classList.add('correct');
        if (idx === Number(chosenIdx) && !isCorrect) btn.classList.add('incorrect');
      });

      const expBox = $('exp-box');
      expBox.innerHTML = `
        <div style="font-weight:bold; margin-bottom:0.5rem;">${isCorrect ? '✓ სწორია!' : '✕ არასწორია'}</div>
        <p>${q.explanation}</p>
        <a href="${q.source_url}" target="_blank" style="color:var(--primary); display:inline-block; margin-top:0.5rem;">წყარო: ${q.source_title}</a>
      `;
      expBox.style.display = 'block';

      const nextBtn = $('next-btn');
      nextBtn.style.display = 'inline-block';
      nextBtn.textContent = (currentIndex + 1 < currentQuestions.length) ? 'შემდეგი კითხვა →' : 'შედეგების ნახვა →';
    };

    window.nextQuestion = function() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        renderQuestion();
      } else {
        $('res-score').textContent = score;
        $('res-total').textContent = `${currentQuestions.length * 100} შესაძლო ქულიდან`;
        navigate('result');
      }
    };

    function handleAuth() {
      const email = $('auth-email').value;
      if (!email) { $('auth-msg').textContent = 'შეიყვანეთ ელ-ფოსტა'; return; }
      $('auth-msg').textContent = 'წარმატებით შეხვედით სისტემაში!';
      setTimeout(() => navigate('play'), 1000);
    }

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);

    renderCatalog();
  </script>
</body>
</html>
