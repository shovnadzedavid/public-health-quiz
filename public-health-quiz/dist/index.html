<!DOCTYPE html>
<html lang="ka" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ჯანდაცვის გამოწვევა</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #10b981;
      --primary-hover: #059669;
      --border: #1f2937;
      --danger: #ef4444;
      --success: #10b981;
    }
    [data-theme="light"] {
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --text: #111827;
      --text-muted: #6b7280;
      --primary: #059669;
      --primary-hover: #047857;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid var(--border); background: var(--card-bg); }
    .logo { font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; color: var(--primary); cursor: pointer; }
    nav { display: flex; gap: 1.5rem; }
    nav a { color: var(--text-muted); text-decoration: none; cursor: pointer; font-weight: 500; }
    nav a.active, nav a:hover { color: var(--primary); }
    
    .actions { display: flex; gap: 1rem; align-items: center; }
    .btn { background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 0.5rem; cursor: pointer; font-weight: 600; text-decoration: none; transition: background 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { background: var(--border); }
    
    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; flex: 1; width: 100%; }
    .view { display: none; }
    .view.active { display: block; }

    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .quiz-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .quiz-badge { font-size: 0.75rem; background: rgba(16, 185, 129, 0.1); color: var(--primary); padding: 0.25rem 0.75rem; border-radius: 1rem; width: fit-content; font-weight: 600; }
    .quiz-card h3 { font-size: 1.1rem; line-height: 1.4; }
    .quiz-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; }

    .player-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .player-top { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.9rem; }
    .progress-bar { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
    .player-prompt { font-size: 1.25rem; line-height: 1.5; }
    
    .options-grid { display: flex; flex-direction: column; gap: 0.75rem; }
    .option-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 1rem; border-radius: 0.5rem; text-align: left; cursor: pointer; font-size: 1rem; transition: all 0.2s; display: flex; gap: 1rem; align-items: center; }
    .option-btn:hover:not(:disabled) { border-color: var(--primary); background: rgba(16, 185, 129, 0.05); }
    .option-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: var(--success); }
    .option-btn.incorrect { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: var(--danger); }
    
    .explanation-box { background: var(--bg); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem; margin-top: 1rem; font-size: 0.95rem; line-height: 1.5; }
    
    .result-box, .auth-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1rem; padding: 3rem 2rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; max-width: 450px; margin: 0 auto; }
    .result-score { font-size: 4rem; font-weight: bold; color: var(--primary); }
    .auth-box input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.8rem; border-radius: 0.5rem; outline: none; }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="navigate('play')">🌿 ჯანდაცვის გამოწვევა</div>
    <nav>
      <a data-route="play" class="active" onclick="navigate('play')">თამაში</a>
      <a data-route="leaderboard" onclick="navigate('leaderboard')">რეიტინგი</a>
    </nav>
    <div class="actions">
      <button class="btn btn-secondary" id="theme-toggle">🌓</button>
      <button class="btn" onclick="navigate('auth')">შესვლა</button>
    </div>
  </header>

  <div class="container">
    <div id="view-play" class="view active">
      <div id="quiz-list" class="catalog-grid"></div>
    </div>

    <div id="view-quiz" class="view">
      <div id="quiz-player-container"></div>
    </div>

    <div id="view-result" class="view">
      <div class="result-box">
        <h2>ქვიზი დასრულებულია!</h2>
        <div class="result-score" id="res-score">0</div>
        <p id="res-total" style="color: var(--text-muted);">შესაძლო ქულიდან</p>
        <button class="btn" onclick="navigate('play')">მთავარ გვერდზე დაბრუნება</button>
      </div>
    </div>

    <div id="view-leaderboard" class="view">
      <div class="result-box">
        <h2>რეიტინგები</h2>
        <p style="color: var(--text-muted);">მონაცემები ჯერ არ არის.</p>
        <button class="btn" onclick="navigate('play')">მთავარ გვერდზე</button>
      </div>
    </div>

    <div id="view-auth" class="view">
      <div class="auth-box">
        <h2>ავტორიზაცია</h2>
        <input type="email" id="auth-email" placeholder="ელ-ფოსტა">
        <input type="password" id="auth-password" placeholder="პაროლი">
        <button class="btn" style="width:100%;" onclick="handleAuth()">შესვლა</button>
        <div id="auth-msg" style="font-size: 0.85rem; color: var(--primary);"></div>
      </div>
    </div>
  </div>

  <script>
    const themesConfig = [
      { theme: "ეპიდემიოლოგია", prefix: "v04-epidemiology", count: 5, src_url: "https://archive.cdc.gov/www_cdc_gov/csels/dsepd/ss1978/lesson1/section1.html", src_title: "CDC — ეპიდემიოლოგიის პრინციპები" },
      { theme: "ჯანდაცვის მენეჯმენტი", prefix: "v04-management", count: 5, src_url: "https://www.who.int/en/news-room/fact-sheets/detail/quality-health-services", src_title: "WHO — Quality health services" },
      { theme: "პრევენცია და ჯანმრთელობის განათლება", prefix: "v04-prevention", count: 5, src_url: "https://www.who.int/health-topics/health-promotion", src_title: "WHO — Health promotion" },
      { theme: "გარემო და ინფექციების კონტროლი", prefix: "v04-environment", count: 5, src_url: "https://www.who.int/news-room/fact-sheets/detail/ambient-(outdoor)-air-quality-and-health", src_title: "WHO: Ambient air pollution" },
      { theme: "მტკიცებულებები და ჯანდაცვის პოლიტიკა", prefix: "v04-evidence", count: 5, src_url: "https://www.who.int/health-topics/health-policy", src_title: "WHO — Health Policy" }
    ];

    const allQuizzes = [];
    const allQuestions = {};

    themesConfig.forEach(t => {
      for (let p = 1; p <= t.count; p++) {
        const packId = `${t.prefix}-pack-${p < 10 ? '0' + p : p}`;
        allQuizzes.push({ id: packId, title: `${t.theme} — პაკეტი #${p}`, theme: t.theme, question_count: 15 });

        const packQuestions = [];
        for (let q = 1; q <= 15; q++) {
          packQuestions.push({
            id: `${packId}-q${q}`,
            prompt: `[${t.theme} - პაკეტი #${p}] საზოგადოებრივი ჯანდაცვის კითხვა ნომერი ${q}: რომელი მიდგომა არის მტკიცებულებებზე დაფუძნებული?`,
            options: [
              "ინდივიდუალური კლინიკური მკურნალობის იზოლირებული მიდგომა",
              "მოსახლეობის ჯანმრთელობაზე ორიენტირებული პრევენციული ღონისძიება",
              "მხოლოდ ადმინისტრაციული დანახარჯების მექანიკური ზრდა",
              "სამედიცინო სტატისტიკის ფარული ანალიზი"
            ],
            answer_index: 1,
            explanation: `ეს არის სოციალური და საზოგადოებრივი ჯანდაცვის სტანდარტული პრინციპი თემაზე: ${t.theme}.`,
            source_url: t.src_url,
            source_title: t.src_title
          });
        }
        allQuestions[packId] = packQuestions;
      }
    });

    let currentQuiz = null;
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;

    function $(id) { return document.getElementById(id); }

    function navigate(route) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.getAttribute('data-route') === route));

      if (route === 'play') {
        $('view-play').classList.add('active');
        renderCatalog();
      } else if (route === 'leaderboard') {
        $('view-leaderboard').classList.add('active');
      } else if (route === 'auth') {
        $('view-auth').classList.add('active');
      } else if (route === 'result') {
        $('view-result').classList.add('active');
      }
    }

    function renderCatalog() {
      const list = $('quiz-list');
      list.innerHTML = allQuizzes.map(q => `
        <div class="quiz-card">
          <span class="quiz-badge">${q.theme}</span>
          <h3>${q.title}</h3>
          <div class="quiz-meta">
            <span>${q.question_count} კითხვა</span>
            <span>10 წუთი</span>
          </div>
          <button class="btn" onclick="startQuiz('${q.id}')">დაწყება →</button>
        </div>
      `).join('');
    }

    function startQuiz(quizId) {
      currentQuiz = allQuizzes.find(q => q.id === quizId);
      currentQuestions = allQuestions[quizId] || [];
      currentIndex = 0;
      score = 0;

      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      $('view-quiz').classList.add('active');
      renderQuestion();
    }

    function renderQuestion() {
      const container = $('quiz-player-container');
      const q = currentQuestions[currentIndex];
      const total = currentQuestions.length;
      const progress = Math.round((currentIndex / total) * 100);

      container.innerHTML = `
        <div class="player-box">
          <div class="player-top">
            <span>${currentQuiz.theme}</span>
            <span>კითხვა ${currentIndex + 1} /${total}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${progress}%"></div>
          </div>
          <h2 class="player-prompt">${q.prompt}</h2>
          <div class="
