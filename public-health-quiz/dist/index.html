<!DOCTYPE html>
<html lang="ka" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ჯანდაცვის გამოწვევა</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #10b981;
      --primary-hover: #059669;
      --border: #1f2937;
      --danger: #ef4444;
      --success: #10b981;
    }
    [data-theme="light"] {
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --text: #111827;
      --text-muted: #6b7280;
      --primary: #059669;
      --primary-hover: #047857;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid var(--border); background: var(--card-bg); }
    .logo { font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; color: var(--primary); }
    nav { display: flex; gap: 1.5rem; }
    nav a { color: var(--text-muted); text-decoration: none; cursor: pointer; font-weight: 500; }
    nav a.active, nav a:hover { color: var(--primary); }
    .actions { display: flex; gap: 1rem; align-items: center; }
    .btn { background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 0.5rem; cursor: pointer; font-weight: 600; text-decoration: none; transition: background 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { background: var(--border); }
    
    .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; flex: 1; width: 100%; }
    .view { display: none; }
    .view.active { display: block; }

    /* Catalog */
    .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .quiz-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .quiz-badge { font-size: 0.75rem; background: rgba(16, 185, 129, 0.1); color: var(--primary); padding: 0.25rem 0.75rem; border-radius: 1rem; width: fit-content; font-weight: 600; }
    .quiz-card h3 { font-size: 1.1rem; line-height: 1.4; }
    .quiz-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; }

    /* Player */
    .player-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .player-top { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.9rem; }
    .progress-bar { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
    .player-prompt { font-size: 1.25rem; line-height: 1.5; }
    .options-grid { display: flex; flex-direction: column; gap: 0.75rem; }
    .option-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 1rem; border-radius: 0.5rem; text-align: left; cursor: pointer; font-size: 1rem; transition: all 0.2s; display: flex; gap: 1rem; align-items: center; }
    .option-btn:hover:not(:disabled) { border-color: var(--primary); background: rgba(16, 185, 129, 0.05); }
    .option-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: var(--success); }
    .option-btn.incorrect { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: var(--danger); }
    .explanation-box { background: var(--bg); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1rem; margin-top: 1rem; font-size: 0.95rem; line-height: 1.5; }
    .exp-title { font-weight: bold; margin-bottom: 0.5rem; }
    .exp-link { display: inline-block; margin-top: 0.5rem; color: var(--primary); text-decoration: none; }

    /* Result */
    .result-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 1rem; padding: 3rem 2rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
    .result-score { font-size: 4rem; font-weight: bold; color: var(--primary); }
    .loading, .empty { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 1.1rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo">🌿 ჯანდაცვის გამოწვევა</div>
    <nav>
      <a data-route="play" class="active">თამაში</a>
      <a data-route="leaderboard">რეიტინგი</a>
    </nav>
    <div class="actions">
      <button class="btn btn-secondary" id="theme-toggle">🌓</button>
    </div>
  </header>

  <div class="container">
    <!-- Catalog View -->
    <div id="view-play" class="view active">
      <div id="quiz-list" class="catalog-grid">
        <div class="loading">ქუიზები იტვირთება...</div>
      </div>
    </div>

    <!-- Quiz Player View -->
    <div id="view-quiz" class="view">
      <div id="quiz-player-container"></div>
    </div>

    <!-- Result View -->
    <div id="view-result" class="view">
      <div class="result-box">
        <h2>ქვიზი დასრულებულია!</h2>
        <div class="result-score" id="res-score">0</div>
        <p id="res-total" style="color: var(--text-muted);">შესაძლო ქულიდან</p>
        <button class="btn" onclick="navigate('play')">მთავარ გვერდზე დაბრუნება</button>
      </div>
    </div>

    <!-- Leaderboard View -->
    <div id="view-leaderboard" class="view">
      <div class="result-box">
        <h2>რეიტინგები მალე დაემატება</h2>
        <button class="btn" onclick="navigate('play')">მთავარ გვერდზე</button>
      </div>
    </div>
  </div>

  <script>
    // Supabase კონფიგურაცია (ჩასვი შენი რეალური მონაცემები)
    const SUPABASE_URL = "https://onahibvzltcvuxoyowno.supabase.co";
    const SUPABASE_KEY = "sb_secret_2BzQwGZVVL_la9aMmqwmyw_1StwXewB";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentQuiz = null;
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let userAnswers = [];

    function $(id) { return document.getElementById(id); }

    // მარტივი როუტინგი
    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('DOMContentLoaded', () => {
      handleRoute();
      setupTheme();
    });

    function navigate(route) {
      window.location.hash = route;
    }

    function handleRoute() {
      const hash = window.location.hash.replace('#', '') || 'play';
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.getAttribute('data-route') === hash));

      if (hash === 'play') {
        $('view-play').classList.add('active');
        loadCatalog();
      } else if (hash === 'leaderboard') {
        $('view-leaderboard').classList.add('active');
      } else if (hash.startsWith('quiz/')) {
        $('view-quiz').classList.add('active');
        const quizId = hash.split('/')[1];
        startQuiz(quizId);
      }
    }

    function setupTheme() {
      const btn = $('theme-toggle');
      const saved = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      btn.addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    }

    // კატალოგის ჩატვირთვა უშუალოდ Supabase-დან
    async function loadCatalog() {
      const list = $('quiz-list');
      list.innerHTML = '<div class="loading">იტვირთება ქუიზები...</div>';

      const { data: quizzes, error } = await supabase
        .from('quizzes')
        .select('*')
        .order('id');

      if (error || !quizzes || !quizzes.length) {
        list.innerHTML = '<div class="empty">ქუიზები ვერ მოიძებნა. გთხოვთ შეამოწმოთ ბაზა.</div>';
        return;
      }

      list.innerHTML = quizzes.map(q => `
        <div class="quiz-card">
          <span class="quiz-badge">${q.theme || 'ზოგადი'}</span>
          <h3>${q.title}</h3>
          <div class="quiz-meta">
            <span>${q.question_count || 15} კითხვა</span>
            <span>${Math.round((q.question_count || 15) * 0.7)} წუთი</span>
          </div>
          <button class="btn" onclick="window.location.hash='quiz/${q.id}'">დაწყება →</button>
        </div>
      `).join('');
    }

    // ქვიზის დაწყება და კითხვების წამოღება
    async function startQuiz(quizId) {
      const container = $('quiz-player-container');
      container.innerHTML = '<div class="loading">კითხვები იტვირთება...</div>';

      // 1. ვიღებთ ქუიზს
      const { data: quiz, error: qErr } = await supabase
        .from('quizzes')
        .select('*')
        .eq('id', quizId)
        .single();

      if (qErr || !quiz) {
        container.innerHTML = '<div class="empty">ქუიზი ვერ მოიძებნა.</div>';
        return;
      }

      currentQuiz = quiz;

      // 2. ვიღებთ კითხვებს ამ ქუიზის question_ids მასივით
      const { data: questions, error: qsErr } = await supabase
        .from('questions')
        .select('*')
        .in('id', quiz.question_ids);

      if (qsErr || !questions || !questions.length) {
        container.innerHTML = '<div class="empty">ამ ქუიზში კითხვები ვერ მოიძებნა.</div>';
        return;
      }

      // ვანარჩუნებთ თანმიმდევრობას
      const map = new Map(questions.map(item => [item.id, item]));
      currentQuestions = quiz.question_ids.map(id => map.get(id)).filter(Boolean);

      currentIndex = 0;
      score = 0;
      userAnswers = [];

      renderQuestion();
    }

    function renderQuestion() {
      const container = $('quiz-player-container');
      const q = currentQuestions[currentIndex];
      const total = currentQuestions.length;
      const progress = Math.round((currentIndex / total) * 100);

      container.innerHTML = `
        <div class="player-box">
          <div class="player-top">
            <span>${currentQuiz.theme || ''}</span>
            <span>კითხვა ${currentIndex + 1} / ${total}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${progress}%"></div>
          </div>
          <h2 class="player-prompt">${q.prompt}</h2>
          <div class="options-grid">
            ${q.options.map((opt, idx) => `
              <button class="option-btn" onclick="handleAnswer(${idx})">
                <span style="font-weight:bold; color:var(--primary);">${['A','B','C','D'][idx]}</span>
                <span>${opt}</span>
              </button>
            `).join('')}
          </div>
          <div id="exp-box" class="explanation-box" style="display:none;"></div>
          <div style="margin-top: 1rem; text-align: right;">
            <button id="next-btn" class="btn" style="display:none;" onclick="nextQuestion()">შემდეგი →</button>
          </div>
        </div>
      `;
    }

    window.handleAnswer = function(chosenIdx) {
      const q = currentQuestions[currentIndex];
      const isCorrect = Number(chosenIdx) === Number(q.answer_index);
      if (isCorrect) score += 100;

      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === Number(q.answer_index)) btn.classList.add('correct');
        if (idx === Number(chosenIdx) && !isCorrect) btn.classList.add('incorrect');
      });

      const expBox = $('exp-box');
      expBox.innerHTML = `
        <div class="exp-title">${isCorrect ? '✓ სწორია!' : '✕ არასწორია'}</div>
        <p>${q.explanation || ''}</p>
        ${q.source_url ? `<a class="exp-link" href="${q.source_url}" target="_blank">წყარო: ${q.source_title || 'გადასვლა'}</a>` : ''}
      `;
      expBox.style.display = 'block';

      const nextBtn = $('next-btn');
      nextBtn.style.display = 'inline-block';
      nextBtn.textContent = (currentIndex + 1 < currentQuestions.length) ? 'შემდეგი კითხვა →' : 'შედეგების ნახვა →';
    };

    window.nextQuestion = function() {
      currentIndex++;
      if (currentIndex < currentQuestions.length) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    };

    function finishQuiz() {
      const totalPossible = currentQuestions.length * 100;
      $('res-score').textContent = score;
      $('res-total').textContent = `${totalPossible} შესაძლო ქულიდან`;
      navigate('result');
    }
  </script>
</body>
</html>
